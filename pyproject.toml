[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-pipeline"
version = "0.1.0"
description = "Reusable ML training, augmentation, benchmarking, and checkpoint utilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scipy==1.16.2",
    "scikit-learn==1.7.2",
    "torch>=2.6.0",
    "joblib==1.5.3",
    "xgboost==3.1.2",
    "lightgbm==4.6.0",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
evaluation = [
    "skrub==0.10.0",
    "skore==0.28.0",
]
kumo = [
    "structured-data-models==0.2.1",
    "pyarrow==21.0.0",
]
forecasting = [
    "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
    "timesfm[torch]==3.0.2",
    "chronos-forecasting==2.3.2",
    "toto-models==1.0.0; python_version >= '3.12'",
    "toto-2==2.0.0; python_version >= '3.12'",
]
vision = [
    "torchvision>=0.21",
    "timm==1.0.9",
    "Pillow==12.1.0",
    "albumentations==2.0.8",
    "efficientnet-pytorch==0.7.1",
    "pytorch-lightning==2.6.0",
    "pytorch-wavelets==1.3.0",
    "PyWavelets==1.9.0",
    "ftfy==6.3.1",
]
text = [
    "transformers==5.17.0",
    "peft==0.18.0",
    "datasets==4.4.2",
    "sentence-transformers==5.4.0",
    "google-genai==1.56.0",
]
tabular = [
    "catboost==1.2.10",
    "imbalanced-learn==0.14.1",
    "skrub==0.10.0",
    "skore==0.28.0",
    "tabicl==2.2.0",
    "tabpfn==9.2.0",
    "tabfm[pytorch] @ git+https://github.com/google-research/tabfm.git@d8678b6895f1428a468d4cc299c1ff4cf704e726",
]
research = [
    "openai==2.46.0",
    "torchvision>=0.21",
    "timm==1.0.9",
    "Pillow==12.1.0",
    "albumentations==2.0.8",
    "efficientnet-pytorch==0.7.1",
    "pytorch-lightning==2.6.0",
    "pytorch-wavelets==1.3.0",
    "PyWavelets==1.9.0",
    "ftfy==6.3.1",
    "transformers==5.17.0",
    "peft==0.18.0",
    "datasets==4.4.2",
    "sentence-transformers==5.4.0",
    "google-genai==1.56.0",
    "catboost==1.2.10",
    "imbalanced-learn==0.14.1",
    "skrub==0.10.0",
    "skore==0.28.0",
    "tabicl==2.2.0",
    "tabpfn==9.2.0",
    "tabfm[pytorch] @ git+https://github.com/google-research/tabfm.git@d8678b6895f1428a468d4cc299c1ff4cf704e726",
    "wandb==0.28.1",
    "streamlit==1.52.2",
    "plotly==6.5.0",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "kaggle==1.8.3",
    "kagglehub==1.0.2",
    "jupyter==1.1.1",
    "papermill==2.7.0",
    "rich==14.2.0",
]
llama = [
    "llama-cpp-python==0.3.16",
]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[project.urls]
Repository = "https://github.com/oremaz/ml-playground"

[tool.setuptools.packages.find]
include = ["ml_pipeline*", "pipelines_torch*", "utils*", "data_augmentation*"]
exclude = ["ml_pipeline.tests*"]
